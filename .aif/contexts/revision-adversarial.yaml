version: "1.0.0"

# Contexto reusable de las fases de REVISION. Es deliberadamente distinto del de
# trabajo: un revisor necesita el vocabulario y los criterios, no la plantilla de
# ADR ni las instrucciones de como producir.

materials:
  - id: glosario-agenda
    version: "1.0.0"
  - id: criterios-de-error
    version: "1.0.0"

sections:
  - id: encargo
    title: Que estas revisando
    body: |
      El encargo original esta en `OBJETIVO.md`, en la raiz del workspace. Lo que
      revisas tiene que ser coherente con el: con sus requerimientos, con sus
      Constrains y con sus reglas.

      Un trabajo que contradice un Constrain es un hallazgo, aunque este bien
      hecho por lo demas.

  - id: confinamiento
    title: Donde puedes trabajar, y que NO puedes hacer
    body: |
      Trabajas dentro de un worktree de git, con rutas RELATIVAS, y no puedes
      salir de el.

      Y no tienes permiso de EDICION. Puedes leer todo y escribir UN fichero: tu
      informe. No corriges lo que encuentras, ni siquiera una errata evidente.
      Encontrar y arreglar son dos actos, y quien hace los dos seguidos acaba
      metiendo arreglos que nadie ha revisado.

  - id: forma-del-informe
    title: La forma del informe
    body: |
      Tu informe se llama como la fase que revisas y vive en `docs/revisiones/`.

      Cada hallazgo lleva cuatro cosas: DONDE (fichero y linea), QUE
      encontraste, POR QUE importa, y que FALTA para resolverlo. Sin el DONDE no
      se puede atender; sin el POR QUE se discute.

      Y termina siempre con el apartado "Lo que NO he comprobado", explicito:
      que no miraste, por que, y con que criterio elegiste lo que si miraste.
      Una revision sin limites declarados se lee como si lo hubiera cubierto
      todo, y eso da una confianza que nadie ha ganado.

      Si no encuentras nada, dilo y di como lo buscaste. "Sin hallazgos" a secas
      es indistinguible de no haber mirado.
