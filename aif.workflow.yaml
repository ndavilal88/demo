workflow:
  version: 1
  name: agenda-personal

# Pipeline de ingenieria AI-First.
#
#                         ┌── arquitectura ───┐
#                         │                   │
#  requisitos ────────────┼── ux ─────────────┼── implementacion
#                         │                   │
#                         └── seguridad ──────┘
#                                                     │
#                                                     ▼
#                                                  pruebas
#                                                     │
#                         ┌───────────────────────────┼─────────┐
#                         ▼                           ▼         ▼
#                   performance          seguridad-revision   docs
#                         └───────────────────────────┬─────────┘
#                                                     ▼
#                                                  entrega
#
# El DAG es real: lo declara `requires`, no el orden del fichero. AIF Local
# ejecuta UNA fase a la vez y toma la primera lista en orden de declaracion
# (D15), asi que los dos abanicos se recorren de arriba abajo — pero ninguna
# fase empieza sin que TODAS las suyas esten aprobadas.
#
# Hay DOS fases de seguridad porque son dos trabajos distintos: `seguridad`
# modela amenazas sobre el diseno, antes de que exista codigo, y
# `seguridad-revision` revisa el codigo que ya existe. Los ids son unicos, de
# ahi el nombre largo del segundo.
#
# EL AVISO DEL WORKSPACE va en las diez fases y no es decorativo: el agente
# trabaja en un worktree y el perfil hermetico confina las herramientas de
# fichero a el. Sin decirlo, el agente sale a explorar la raiz del proyecto, se
# le deniega y la fase muere — medido, seis intentos seguidos.

phases:
  - id: requisitos
    requires: []
    runtime: claude-code
    instructions: |
      Define QUE hay que construir, sin decidir todavia COMO.

      El producto es una AGENDA PERSONAL: una aplicacion en Node.js para
      apuntar citas —fecha, hora, titulo y notas—, con una interfaz visual en el
      navegador que las muestra por dia.

      Escribe `docs/requisitos.md` con estas secciones, en este orden:
        ## Problema
        ## Actores          (quien usa la agenda y para que)
        ## Requisitos funcionales     (numerados RF-1, RF-2, ...)
        ## Requisitos no funcionales  (numerados RNF-1, RNF-2, ...)
        ## Fuera de alcance

      Como minimo tiene que poder: anadir una cita, listar las de un dia,
      buscar por texto y borrar una. Y decir que pasa con los casos feos: dos
      citas a la misma hora, una fecha que no existe, un titulo vacio.

      RESTRICCIONES QUE MANDAN sobre todo lo demas, y que tienen que quedar
      escritas en los requisitos no funcionales:
        - Solo la biblioteca estandar de Node. Cero dependencias, cero npm install.
        - La interfaz es un fichero HTML estatico que se abre con doble clic.
        - Nada de red ni de nube: las citas viven en un fichero JSON del proyecto.

      No escribas codigo en esta fase.

      TODO LO QUE NECESITAS ESTA EN ESTE DIRECTORIO Y POR DEBAJO. No mires ni
      escribas fuera de el: las herramientas de fichero estan confinadas aqui, y
      un intento de salir se deniega y tumba la fase. Usa siempre rutas
      RELATIVAS.
    permissions: [Read, Write, Edit, Glob, Grep]
    validators: [hay-requisitos]
    gate:
      human: true

  - id: arquitectura
    requires: [requisitos]
    runtime: claude-code
    instructions: |
      Lee `docs/requisitos.md` y decide COMO se construye.

      Escribe `docs/arquitectura.md` con:
        ## Componentes            (que ficheros existiran y de que se ocupa cada uno)
        ## Modelo de una cita     (la forma exacta, campo a campo, con su tipo)
        ## Operaciones            (anadir, listar por dia, buscar, borrar)
        ## Almacenamiento         (como se guarda y que pasa si el fichero no existe)
        ## Estado para la interfaz (el JSON que la interfaz va a leer)

      La estructura de ficheros que hay que respetar es esta:
        src/agenda.js       las reglas: anadir, listar, buscar, borrar, validar
        src/almacen.js      leer y escribir datos/agenda.json
        src/main.js         siembra unas citas de ejemplo y escribe web/eventos.json
        web/index.html      la interfaz visual
        web/eventos.json    lo que main.js produce y la interfaz lee

      No escribas codigo todavia.

      TODO LO QUE NECESITAS ESTA EN ESTE DIRECTORIO Y POR DEBAJO. No mires ni
      escribas fuera de el: las herramientas de fichero estan confinadas aqui, y
      un intento de salir se deniega y tumba la fase. Usa siempre rutas
      RELATIVAS.
    permissions: [Read, Write, Edit, Glob, Grep]
    validators: [hay-arquitectura]
    gate:
      human: true

  - id: ux
    requires: [requisitos]
    runtime: claude-code
    instructions: |
      Lee `docs/requisitos.md` y define QUE VE la persona.

      Escribe `docs/ux.md` con:
        ## Que tiene que entender de un vistazo
        ## Pantalla       (que hay en la pagina, de arriba abajo)
        ## Estados        (cargando, dia sin citas, dia con citas, error al cargar)
        ## Accesibilidad  (contraste, tamanos, que funcione sin raton)

      La interfaz es un solo `web/index.html` sin dependencias ni build: HTML,
      CSS y JavaScript en el mismo fichero. Describela con ese limite puesto.

      Piensa en lo aburrido y necesario: como se ve una cita, como se distingue
      la de ahora de la de la semana que viene, y que pasa cuando no hay ninguna.

      No escribas el HTML todavia: aqui se decide que se ve, no como se codifica.

      TODO LO QUE NECESITAS ESTA EN ESTE DIRECTORIO Y POR DEBAJO. No mires ni
      escribas fuera de el: las herramientas de fichero estan confinadas aqui, y
      un intento de salir se deniega y tumba la fase. Usa siempre rutas
      RELATIVAS.
    permissions: [Read, Write, Edit, Glob, Grep]
    validators: [hay-ux]
    gate:
      human: true

  - id: seguridad
    requires: [requisitos]
    runtime: claude-code
    instructions: |
      Lee `docs/requisitos.md` y modela las amenazas ANTES de que exista codigo.

      Escribe `docs/amenazas.md` con:
        ## Superficie    (por donde entran datos: el fichero de citas, lo que se teclea, el navegador)
        ## Amenazas      (una por seccion, numeradas A-1, A-2, ...)
        ## Mitigaciones  (cada una citando la amenaza que cierra)
        ## Lo que NO se protege   (dicho a proposito, no escondido)

      Al menos estas tienen que estar tratadas, porque son las que esta agenda
      se puede encontrar de verdad:
        - una cita con campos que nadie valida, o con una fecha que no existe
        - `datos/agenda.json` corrupto o con contenido que no escribio la app
        - texto de una cita que acaba dentro del HTML de la interfaz

      Prohibido en el codigo que vendra despues, y esta fase tiene que dejarlo
      escrito: eval, new Function, child_process y cualquier llamada de red.

      TODO LO QUE NECESITAS ESTA EN ESTE DIRECTORIO Y POR DEBAJO. No mires ni
      escribas fuera de el: las herramientas de fichero estan confinadas aqui, y
      un intento de salir se deniega y tumba la fase. Usa siempre rutas
      RELATIVAS.
    permissions: [Read, Write, Edit, Glob, Grep]
    validators: [hay-amenazas]
    gate:
      human: true

  - id: implementacion
    requires: [arquitectura, ux, seguridad]
    runtime: claude-code
    instructions: |
      Construye la agenda siguiendo `docs/arquitectura.md`, `docs/ux.md` y
      `docs/amenazas.md`.

      Escribe:
        src/agenda.js     anadir, listar por dia, buscar, borrar y VALIDAR
        src/almacen.js    leer y escribir datos/agenda.json
        src/main.js       que al ejecutarse escribe `web/eventos.json`
        web/index.html    la interfaz visual, un solo fichero

      REGLAS QUE NO SE NEGOCIAN:
        - Solo biblioteca estandar de Node. Ningun paquete externo.
        - Nada de eval, new Function, child_process ni red.
        - La interfaz pinta lo que lee de `web/eventos.json` con textContent,
          nunca con innerHTML sobre datos.
        - `node src/main.js` tiene que terminar solo, sin quedarse esperando, y
          funcionar aunque `datos/agenda.json` no exista todavia.

      TU NO PUEDES EJECUTAR NADA en esta fase: no tienes shell. Escribe el codigo
      como si fuera a correr — de ejecutarlo se encarga la comprobacion del gate.

      TODO LO QUE NECESITAS ESTA EN ESTE DIRECTORIO Y POR DEBAJO. No mires ni
      escribas fuera de el: las herramientas de fichero estan confinadas aqui, y
      un intento de salir se deniega y tumba la fase. Usa siempre rutas
      RELATIVAS.
    permissions: [Read, Write, Edit, Glob, Grep]
    validators: [compila-agenda]
    gate:
      human: true

  - id: pruebas
    requires: [implementacion]
    runtime: claude-code
    instructions: |
      Escribe pruebas de verdad para lo que hay en `src/`, con el runner que trae
      Node: `node:test` y `node:assert/strict`.

      Deja los ficheros en `test/`, con nombre `*.test.js`. Cubre al menos:
        - una cita valida se anade y aparece al listar su dia
        - una cita con fecha imposible o titulo vacio se RECHAZA
        - buscar por texto encuentra la que es y no las demas
        - borrar quita solo esa, y borrar algo que no existe no revienta
        - leer un `datos/agenda.json` que no existe da una agenda vacia

      Que las pruebas FALLEN si el codigo esta mal es el objetivo: no escribas
      pruebas que pasen sin mirar nada. Si al escribirlas descubres un fallo en
      `src/`, arreglalo.

      Tampoco aqui puedes ejecutar: las corre el gate con `node --test`, que
      descubre `test/*.test.js` el solo.

      TODO LO QUE NECESITAS ESTA EN ESTE DIRECTORIO Y POR DEBAJO. No mires ni
      escribas fuera de el: las herramientas de fichero estan confinadas aqui, y
      un intento de salir se deniega y tumba la fase. Usa siempre rutas
      RELATIVAS.
    permissions: [Read, Write, Edit, Glob, Grep]
    validators: [pasan-pruebas]
    gate:
      human: true

  - id: performance
    requires: [pruebas]
    runtime: claude-code
    instructions: |
      Mide, no opines.

      Escribe `bench/bench.js`: solo biblioteca estandar, que llene una agenda
      con muchas citas —miles—, mida con `performance.now()` cuanto tarda
      listar un dia y buscar por texto, y escriba el resultado por stdout. Tiene
      que terminar solo y salir con codigo 0.

      Escribe `docs/performance.md` con:
        ## Que se mide
        ## Como se mide   (el comando exacto: node bench/bench.js)
        ## Resultados     (los numeros que espera ver quien lo ejecute)
        ## Que haria falta para ir mas rapido

      TODO LO QUE NECESITAS ESTA EN ESTE DIRECTORIO Y POR DEBAJO. No mires ni
      escribas fuera de el: las herramientas de fichero estan confinadas aqui, y
      un intento de salir se deniega y tumba la fase. Usa siempre rutas
      RELATIVAS.
    permissions: [Read, Write, Edit, Glob, Grep]
    validators: [mide-performance]
    gate:
      human: true

  - id: seguridad-revision
    requires: [pruebas]
    runtime: claude-code
    instructions: |
      Vuelve a `docs/amenazas.md` y revisa contra el el codigo que YA existe.

      Escribe `docs/seguridad-revision.md` con:
        ## Amenaza por amenaza   (cita A-1, A-2, ... y di si esta cerrada, con el
                                  fichero y la linea donde se ve)
        ## Lo que encontre       (si no encontraste nada, dilo y explica que
                                  buscaste; no inventes hallazgos)
        ## Lo que sigue abierto

      Si encuentras algo, ARREGLALO en `src/` y dilo en el documento. Un informe
      que describe un agujero sin cerrarlo no es una revision, es una nota.

      TODO LO QUE NECESITAS ESTA EN ESTE DIRECTORIO Y POR DEBAJO. No mires ni
      escribas fuera de el: las herramientas de fichero estan confinadas aqui, y
      un intento de salir se deniega y tumba la fase. Usa siempre rutas
      RELATIVAS.
    permissions: [Read, Write, Edit, Glob, Grep]
    validators: [revision-seguridad]
    gate:
      human: true

  - id: docs
    requires: [pruebas]
    runtime: claude-code
    instructions: |
      Escribe el `README.md` que necesita alguien que llega hoy al proyecto:
        ## Que es esto
        ## Como se ejecuta   (los comandos exactos, incluido como abrir la interfaz)
        ## Como esta hecho   (resumen corto, remitiendo a docs/arquitectura.md)
        ## Como se prueba    (node --test)

      Los comandos que escribas tienen que ser los que de verdad funcionan con
      los ficheros que hay. Un README con un comando que no existe es peor que no
      tener README.

      TODO LO QUE NECESITAS ESTA EN ESTE DIRECTORIO Y POR DEBAJO. No mires ni
      escribas fuera de el: las herramientas de fichero estan confinadas aqui, y
      un intento de salir se deniega y tumba la fase. Usa siempre rutas
      RELATIVAS.
    permissions: [Read, Write, Edit, Glob, Grep]
    validators: [hay-docs]
    gate:
      human: true

  - id: entrega
    requires: [performance, seguridad-revision, docs]
    runtime: claude-code
    instructions: |
      Cierra el paquete. Escribe `docs/entrega.md` con:
        ## Que se entrega      (la lista de ficheros, uno por linea)
        ## Como se comprueba   (los comandos que cualquiera puede correr)
        ## Estado de cada fase (requisitos, arquitectura, ux, seguridad,
                                implementacion, pruebas, performance,
                                seguridad-revision, docs — y que dejo cada una)
        ## Riesgos que quedan abiertos

      No adornes: si algo quedo a medias, esta es la fase en la que se dice.

      TODO LO QUE NECESITAS ESTA EN ESTE DIRECTORIO Y POR DEBAJO. No mires ni
      escribas fuera de el: las herramientas de fichero estan confinadas aqui, y
      un intento de salir se deniega y tumba la fase. Usa siempre rutas
      RELATIVAS.
    permissions: [Read, Write, Edit, Glob, Grep]
    validators: [listo-para-entregar]
    gate:
      human: true
